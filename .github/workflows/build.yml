name: Build iOS App (.IPA)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App for iOS Device
        run: |
          xcodebuild -project ProRawEnhancer.xcodeproj \
            -scheme ProRawEnhancer \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ProRawEnhancer.app Payload/
          zip -r ProRawEnhancer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProRawEnhancer-IPA
          path: ProRawEnhancer.ipa
          retention-days: 14
