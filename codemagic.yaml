workflows:
  ios-app:
    name: Build ProRAW Studio IPA
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode Project
        script: |
          xcodegen generate
      - name: Build App
        script: |
          xcodebuild -project ProRawEnhancer.xcodeproj \
            -scheme ProRawEnhancer \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package .IPA
        script: |
          # Localiza automaticamente onde o Xcode gerou o .app
          APP_PATH=$(find build -name "ProRawEnhancer.app" -type d | head -n 1)
          echo "App encontrado em: $APP_PATH"
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          # Compacta a pasta Payload completa
          zip -qr ProRawEnhancer.ipa Payload
          
          # Mostra o tamanho real do arquivo gerado
          ls -lh ProRawEnhancer.ipa
    artifacts:
      - ProRawEnhancer.ipa
